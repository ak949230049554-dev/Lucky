name: Build PolyDrift APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Game Zip
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            mkdir -p game_src
            ZIP_FILE=$(ls *.zip | head -n 1)
            unzip -o "$ZIP_FILE" -d game_src
            APP_DIR=$(dirname "$(find game_src -maxdepth 2 -name package.json | head -n 1)")
          else
            APP_DIR="."
          fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Make GitHub 3D Models Offline
        working-directory: ${{ env.APP_DIR }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const urlRegex = /https?:\/\/(?:raw\.githubusercontent\.com|[\w-]+\.github\.io|cdn\.jsdelivr\.net\/gh|github\.com)\/[^\s"'`<>)]+?\.(?:glb|gltf|obj|fbx|bin|png|jpg|jpeg|webp|mp3|wav|ogg)(?:\?[^\s"'`<>)]*)?/gi;
          const outDir = path.join(process.cwd(), 'public', 'models');
          fs.mkdirSync(outDir, { recursive: true });

          function getFiles(dir, list = []) {
            if (!fs.existsSync(dir)) return list;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (['node_modules', 'dist', 'android', '.git'].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) getFiles(full, list);
              else if (/\.(ts|tsx|js|jsx|json|html|css)$/i.test(entry.name)) list.push(full);
            }
            return list;
          }

          (async () => {
            const files = getFiles(process.cwd());
            const urlMap = new Map();
            let count = 0;

            for (const file of files) {
              let content = fs.readFileSync(file, 'utf8');
              const matches = content.match(urlRegex);
              if (!matches) continue;

              let changed = false;
              for (const rawUrl of new Set(matches)) {
                if (!urlMap.has(rawUrl)) {
                  try {
                    console.log('Downloading:', rawUrl);
                    const res = await fetch(rawUrl);
                    if (!res.ok) {
                      console.warn(`Skip (${res.status}):`, rawUrl);
                      continue;
                    }
                    const cleanUrl = rawUrl.split('?')[0];
                    let rawName = path.basename(cleanUrl);
                    try { rawName = decodeURIComponent(rawName); } catch {}
                    const safeName = rawName.replace(/[^a-zA-Z0-9._-]/g, '_');
                    const localName = `${count++}_${safeName}`;
                    const buf = Buffer.from(await res.arrayBuffer());
                    fs.writeFileSync(path.join(outDir, localName), buf);
                    urlMap.set(rawUrl, `./models/${localName}`);
                  } catch (err) {
                    console.warn('Skip error:', rawUrl, err.message);
                    continue;
                  }
                }
                if (urlMap.has(rawUrl)) {
                  content = content.split(rawUrl).join(urlMap.get(rawUrl));
                  changed = true;
                }
              }
              if (changed) fs.writeFileSync(file, content, 'utf8');
            }
            console.log(`Total ${urlMap.size} files offline pack ho gayi!`);
          })();
          EOF

      - name: Install and Build Web Game
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build

      - name: Setup Capacitor Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps
          WEB_DIR="dist"
          if [ ! -d "$WEB_DIR" ] && [ -d "build" ]; then WEB_DIR="build"; fi
          rm -f capacitor.config.ts capacitor.config.json
          rm -rf android
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.satish.polydrift",
            "appName": "PolyDrift 3D",
            "webDir": "$WEB_DIR"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Class
        working-directory: ${{ env.APP_DIR }}
        run: |
          cat <<'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PolyDrift-3D-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

